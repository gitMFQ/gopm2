name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # 打 tag 时由 release.yml 负责
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '1' # 单元测试开启 -race 需要 cgo

jobs:
  test:
    name: 格式化 / 静态检查 / 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验依赖文件一致
        run: go mod verify

      - name: gofmt 检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请在本地执行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        run: go test -race -timeout 300s ./...

      - name: 构建二进制
        run: make build

      - name: 冒烟测试（版本号）
        run: |
          ./bin/gopm2 version
          ./bin/gopm2d -version

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 全链路测试：真实拉起 gopm2d，通过 CLI 与 HTTP API 操作进程
      - name: 运行集成测试
        run: make test-integration
